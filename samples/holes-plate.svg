<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="140mm" viewBox="0 0 200 140">
  <!-- A strut-plate style part: outer profile, large bore, and a bolt pattern.
       Validates classification of outer profiles vs. small holes. -->
  <g transform="translate(20,20)">
    <!-- outer profile -->
    <rect x="0" y="0" width="160" height="100" rx="8" ry="8"
          fill="none" stroke="#222222" stroke-width="0.5"/>
    <!-- large central bore (above hole threshold -> profile / pocket) -->
    <circle cx="80" cy="50" r="22" fill="none" stroke="#222222" stroke-width="0.5"/>
    <!-- M6 bolt-clearance holes (below threshold -> drill cycle) -->
    <circle cx="16" cy="16" r="3.2" fill="none" stroke="#222222" stroke-width="0.5"/>
    <circle cx="144" cy="16" r="3.2" fill="none" stroke="#222222" stroke-width="0.5"/>
    <circle cx="16" cy="84" r="3.2" fill="none" stroke="#222222" stroke-width="0.5"/>
    <circle cx="144" cy="84" r="3.2" fill="none" stroke="#222222" stroke-width="0.5"/>
    <circle cx="80" cy="14" r="3.2" fill="none" stroke="#222222" stroke-width="0.5"/>
    <circle cx="80" cy="86" r="3.2" fill="none" stroke="#222222" stroke-width="0.5"/>
  </g>
</svg>
